<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>rerikor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,900;1,400;1,900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0b;
  --text: #e8e6e1;
  --accent: #c8a96e;
  --accent2: #7b6ee0;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
@media (hover: hover) and (pointer: fine) { body { cursor: none; } }

/* noise */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.03;
  pointer-events: none;
  z-index: 10;
}

/* glow following cursor */
#glow {
  position: fixed;
  width: 600px; height: 600px;
  left: 0; top: 0;
  background: radial-gradient(circle, rgba(200,169,110,0.10) 0%, rgba(123,110,224,0.05) 40%, transparent 70%);
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  transition: opacity 1.2s ease;
}

/* ambient drifting light */
.ambient {
  position: fixed;
  width: 50vmax; height: 50vmax;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
}
.a1 { background: rgba(123,110,224,0.10); top: -20vmax; left: -15vmax; animation: drift1 22s ease-in-out infinite alternate; }
.a2 { background: rgba(200,169,110,0.09); bottom: -22vmax; right: -15vmax; animation: drift2 26s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-16vmax, -10vmax) scale(1.2); } }

/* title */
h1 {
  position: relative;
  z-index: 5;
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: clamp(3.2rem, 14vw, 11rem);
  letter-spacing: -0.02em;
  line-height: 1;
  display: flex;
  user-select: none;
}
h1 span {
  display: inline-block;
  opacity: 0;
  transform: translateY(40px);
  filter: blur(12px);
  animation: letterIn 1.4s cubic-bezier(.2,.7,.2,1) forwards;
  transition: color .4s, transform .4s;
}
h1 span:nth-child(1) { animation-delay: .3s; }
h1 span:nth-child(2) { animation-delay: .4s; }
h1 span:nth-child(3) { animation-delay: .5s; }
h1 span:nth-child(4) { animation-delay: .6s; }
h1 span:nth-child(5) { animation-delay: .7s; }
h1 span:nth-child(6) { animation-delay: .8s; }
h1 span:nth-child(7) { animation-delay: .9s; }
h1 span.done {
  opacity: 1; transform: none; filter: none; animation: none;
}
h1 span.done:hover {
  color: var(--accent);
  transform: translateY(-8px);
  font-style: italic;
}
@keyframes letterIn {
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

/* thin line under title */
.line {
  position: absolute;
  z-index: 5;
  left: 50%;
  bottom: 22%;
  height: 1px;
  width: 0;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  transform: translateX(-50%);
  animation: lineIn 1.8s ease 1.5s forwards;
}
@keyframes lineIn { to { width: min(320px, 50vw); } }

/* cursor */
.cursor, .ring {
  position: fixed;
  left: 0; top: 0;
  pointer-events: none;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity .4s, width .25s, height .25s, border-color .25s;
}
.cursor {
  width: 8px; height: 8px;
  background: var(--accent);
  z-index: 9999;
  mix-blend-mode: difference;
}
.ring {
  width: 36px; height: 36px;
  border: 1px solid rgba(200,169,110,0.4);
  z-index: 9998;
}
.ring.big { width: 72px; height: 72px; border-color: rgba(200,169,110,0.85); }
@media (hover: none), (pointer: coarse) { .cursor, .ring { display: none; } }
</style>
</head>
<body>

<div class="ambient a1"></div>
<div class="ambient a2"></div>
<div id="glow"></div>
<div class="cursor" id="cursor"></div>
<div class="ring" id="ring"></div>

<h1 id="title"><span>r</span><span>e</span><span>r</span><span>i</span><span>k</span><span>o</span><span>r</span></h1>
<div class="line"></div>

<script>
const cursor = document.getElementById('cursor');
const ring = document.getElementById('ring');
const glow = document.getElementById('glow');
let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my, gx = mx, gy = my;

addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = mx + 'px';
  cursor.style.top = my + 'px';
  cursor.style.opacity = 1;
  ring.style.opacity = 1;
  glow.style.opacity = 1;
});
document.addEventListener('mouseleave', () => {
  cursor.style.opacity = 0; ring.style.opacity = 0; glow.style.opacity = 0;
});

(function loop() {
  rx += (mx - rx) * 0.14; ry += (my - ry) * 0.14;
  gx += (mx - gx) * 0.06; gy += (my - gy) * 0.06;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  glow.style.left = gx + 'px'; glow.style.top = gy + 'px';
  requestAnimationFrame(loop);
})();

// letters: after intro, enable hover and cursor growth
document.querySelectorAll('#title span').forEach(s => {
  s.addEventListener('animationend', () => s.classList.add('done'));
  s.addEventListener('mouseenter', () => ring.classList.add('big'));
  s.addEventListener('mouseleave', () => ring.classList.remove('big'));
});
</script>
</body>
</html>
