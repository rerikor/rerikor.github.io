<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ♡</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Quicksand', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
            background: linear-gradient(135deg, #f5f0f6 0%, #faf7f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .page-1, .page-2 {
            display: none;
        }
        
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .meow-button {
            background: linear-gradient(135deg, #d4bfd4 0%, #c8adc8 100%);
            color: white;
            border: none;
            padding: 25px 60px;
            font-size: 2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(200, 173, 200, 0.3);
            font-weight: 600;
        }
        
        .meow-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(200, 173, 200, 0.5);
        }
        
        .meow-button:active {
            transform: translateY(-2px) scale(1.02);
        }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .image-placeholder {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #e8d5e8 0%, #f0e5e8 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b89bb8;
            font-size: 14px;
            transition: transform 0.3s ease;
        }
        
        .image-placeholder:hover {
            transform: scale(1.05);
        }
        
        .message {
            margin: 40px 0;
        }
        
        .message h1 {
            font-size: 2.5em;
            color: #b89bb8;
            margin-bottom: 30px;
            font-weight: 600;
        }
        
        .message p {
            font-size: 1.3em;
            line-height: 1.8;
            color: #8b7b8b;
            margin-bottom: 15px;
        }
        
        .message .highlight {
            font-size: 1.5em;
            font-weight: 600;
            color: #c8adc8;
        }
        
        .message .emphasis {
            font-weight: 600;
            color: #b89bb8;
        }
        
        .paw-button {
            background: linear-gradient(135deg, #d4bfd4 0%, #c8adc8 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(200, 173, 200, 0.3);
            font-weight: 600;
        }
        
        .paw-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(200, 173, 200, 0.4);
        }
        
        .paw-button:active {
            transform: translateY(-1px);
        }
        
        .love-message {
            font-size: 4em;
            color: #c8adc8;
            font-weight: 600;
            animation: heartbeat 1.5s ease-in-out infinite;
            margin: 60px 0;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
        }
        
        .hearts {
            font-size: 3em;
            margin: 20px 0;
        }
        
        .back-button {
            background: linear-gradient(135deg, #e8d5e8 0%, #f0e5e8 100%);
            color: #b89bb8;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            .message h1 {
                font-size: 1.8em;
            }
            
            .message p {
                font-size: 1.1em;
            }
            
            .love-message {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <!-- Фоновая музыка -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    
    <!-- Приветственный экран -->
    <div class="container welcome-screen">
        <button class="meow-button" onclick="startSite()">мяу :3</button>
    </div>
    
    <div class="container page-1">
        <div class="image-grid">
            <img src="photo1.png" style="width:100%; height:auto; aspect-ratio: 1/1; object-fit:contain; border-radius:20px; transition: transform 0.3s ease; background: #f9f9f9;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            <img src="photo2.png" style="width:100%; height:auto; aspect-ratio: 1/1; object-fit:contain; border-radius:20px; transition: transform 0.3s ease; background: #f9f9f9;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            <img src="photo3.png" style="width:100%; height:auto; aspect-ratio: 1/1; object-fit:contain; border-radius:20px; transition: transform 0.3s ease; background: #f9f9f9;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            <img src="photo4.png" style="width:100%; height:auto; aspect-ratio: 1/1; object-fit:contain; border-radius:20px; transition: transform 0.3s ease; background: #f9f9f9;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        </div>
        
        <div class="message">
            <h1>Братишка, котенок, хороши моя</h1>
            <p class="highlight">Все будет заебись. Все будет.</p>
            <p class="emphasis">Я рядом.</p>
            <p>Пока мы вместе все будет заебись.</p>
            <p>Плачь, отдыхай, набирайся сил, грусти.</p>
            <p class="emphasis">Я рядом.</p>
            <p style="font-size: 1.5em; margin-top: 20px;">Лютя ^^</p>
        </div>
        
        <button class="paw-button" onclick="showLovePage()">🐾 Тыкни лапкой 🐾</button>
    </div>
    
    <div class="container page-2">
        <div class="hearts">💗 💕 💖 💝 💗</div>
        <div class="love-message">Люблю тебя!!! :3</div>
        <div class="hearts">💖 💝 💗 💕 💖</div>
        <button class="back-button" onclick="showMainPage()">← Назад</button>
    </div>
    
    <script>
        const music = document.getElementById('bgMusic');
        
        // Запуск сайта и музыки
        function startSite() {
            music.play();
            document.querySelector('.welcome-screen').style.display = 'none';
            document.querySelector('.page-1').style.display = 'block';
        }
        
        function showLovePage() {
            document.querySelector('.page-1').style.display = 'none';
            document.querySelector('.page-2').style.display = 'block';
        }
        
        function showMainPage() {
            document.querySelector('.page-1').style.display = 'block';
            document.querySelector('.page-2').style.display = 'none';
        }
    </script>
</body>
</html>
