<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Отчёт экспертизы</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=IBM+Plex+Mono:wght@300;400;500&family=Crimson+Pro:ital,opsz,wght@0,8..48,300;0,8..48,400;0,8..48,600;1,8..48,300&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#09080d;
  --panel:#111019;
  --panel-2:#171622;
  --hairline:#2a2735;
  --text:#ece9f2;
  --text-dim:#9b97ab;
  --text-mute:#807c95;
  --violet:#8f80f0;
  --violet-hi:#a99cff;
  --violet-dim:rgba(143,128,240,.13);
  --hand:#7fb99b;
  --mid:#c8b787;
  --ai:#d98a8a;
  --font-display:'Playfair Display', Georgia, serif;
  --font-body:'Crimson Pro', Georgia, serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  --spring:cubic-bezier(.22,1,.36,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --gut:clamp(16px,4vw,40px);
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;min-height:100vh;background:var(--ink);color:var(--text);
  font-family:var(--font-body);font-size:18px;line-height:1.6;
  padding-block:clamp(28px,6vh,64px) clamp(48px,10vh,96px);
  padding-inline:var(--gut);
  overflow-x:hidden;cursor:none;-webkit-font-smoothing:antialiased;
}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(64vw 46vh at 78% -6%, rgba(143,128,240,.13), transparent 70%);}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.032;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{position:relative;z-index:2;max-width:1120px;margin:0 auto;}

@media (hover:none),(pointer:coarse){ body{cursor:auto;} .cursor,.cursor-ring{display:none !important;} }
.cursor{position:fixed;width:7px;height:7px;background:var(--violet);border-radius:50%;pointer-events:none;
  z-index:9999;transform:translate(-50%,-50%);transition:width .25s var(--spring),height .25s var(--spring);
  mix-blend-mode:difference;}
.cursor-ring{position:fixed;width:32px;height:32px;border:1px solid rgba(143,128,240,.4);border-radius:50%;
  pointer-events:none;z-index:9998;transform:translate(-50%,-50%);
  transition:width .35s var(--spring),height .35s var(--spring),border-color .3s;}

.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:1.5rem;flex-wrap:wrap;
  padding-bottom:1.4rem;border-bottom:1px solid var(--hairline);margin-bottom:clamp(2rem,5vh,3.2rem);}
.brand{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--text-mute);text-decoration:none;transition:color .3s;}
.brand:hover{color:var(--violet);}
.brand b{color:var(--text-dim);font-weight:400;}
.masthead .meta{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-mute);font-variant-numeric:tabular-nums;}

.kicker{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--violet);margin:0 0 1.2rem;}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(2.1rem,6.4vw,4rem);line-height:1.03;
  letter-spacing:-.025em;margin:0 0 1.1rem;text-wrap:balance;max-width:16ch;}
h1 em{font-style:italic;color:var(--violet);}
.lede{color:var(--text-dim);font-weight:300;max-width:58ch;margin:0 0 2.6rem;}
h2{font-family:var(--font-display);font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:700;line-height:1.1;
  letter-spacing:-.015em;margin:0 0 .7rem;text-wrap:balance;}
.sec-note{color:var(--text-dim);font-weight:300;font-size:.95rem;max-width:56ch;margin:0 0 2rem;}
.eyebrow{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--violet);display:block;margin-bottom:.7rem;}
section{margin-bottom:clamp(3.4rem,8vh,5.6rem);}
.rule{border:none;border-top:1px solid var(--hairline);margin:0 0 clamp(3.4rem,8vh,5.6rem);}

/* сводка */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;
  background:var(--hairline);border:1px solid var(--hairline);margin-bottom:clamp(2.4rem,6vh,3.6rem);}
.tile{background:var(--panel);padding:1.5rem 1.4rem;display:flex;flex-direction:column;gap:.55rem;
  transition:background .35s var(--ease);}
.tile:hover{background:var(--panel-2);}
.tile .k{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-mute);}
.tile .v{font-family:var(--font-display);font-size:2.5rem;font-weight:900;line-height:.95;
  font-variant-numeric:tabular-nums;}
.tile .s{font-size:.85rem;color:var(--text-dim);font-weight:300;line-height:1.45;}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:.1rem;}
.spark i{flex:1;background:var(--violet);opacity:.45;min-height:2px;transition:height .9s var(--spring);}
.spark i.hi{opacity:1;}

/* полюса */
.poles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.2rem;}
.pole{background:var(--panel);border:1px solid var(--hairline);padding:1.3rem;display:flex;gap:1.2rem;
  align-items:center;position:relative;overflow:hidden;
  transition:border-color .4s var(--ease),transform .4s var(--spring);}
.pole::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:currentColor;
  transform-origin:left;transform:scaleX(0);transition:transform 1s var(--spring);}
.pole.on::before{transform:scaleX(1);}
.pole:hover{border-color:currentColor;transform:translateY(-3px);}
.pole img{width:104px;height:104px;object-fit:cover;flex-shrink:0;border:1px solid var(--hairline);
  transition:transform .6s var(--spring);}
.pole:hover img{transform:scale(1.05);}
.pole .k{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-mute);margin-bottom:.45rem;}
.pole .v{font-family:var(--font-display);font-size:2.1rem;font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;}
.pole .v small{font-family:var(--font-mono);font-size:.62rem;color:var(--text-mute);font-weight:400;}
.pole .s{font-size:.86rem;color:var(--text-dim);font-weight:300;margin-top:.35rem;line-height:1.45;}

/* фильтры */
.controls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1.6rem;}
.chip{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  padding:.55rem .9rem;background:transparent;border:1px solid var(--hairline);color:var(--text-dim);
  cursor:none;transition:all .3s var(--ease);}
.chip:hover{color:var(--text);border-color:var(--text-mute);}
.chip[aria-pressed="true"]{background:var(--violet-dim);border-color:var(--violet);color:var(--violet-hi);}
.chip:focus-visible{outline:2px solid var(--violet-hi);outline-offset:3px;}

/* рейтинг работ */
.rank{border-top:1px solid var(--hairline);}
.rank-item{border-bottom:1px solid var(--hairline);}
.rank-btn{width:100%;display:grid;grid-template-columns:2.2rem 48px 1fr auto;gap:1rem;align-items:center;
  padding:.7rem .5rem;background:transparent;border:none;text-align:left;cursor:none;color:inherit;
  font-family:inherit;transition:background .3s var(--ease);}
.rank-btn:hover{background:var(--panel);}
.rank-btn:focus-visible{outline:2px solid var(--violet-hi);outline-offset:-2px;}
.rank-pos{font-family:var(--font-mono);font-size:.62rem;color:var(--text-mute);font-variant-numeric:tabular-nums;}
.rank-btn img{width:48px;height:48px;object-fit:cover;border:1px solid var(--hairline);display:block;
  transition:transform .5s var(--spring);}
.rank-btn:hover img{transform:scale(1.07);}
.rank-mid{min-width:0;display:block;}
.rank-top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.35rem;}
.rank-name{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;color:var(--text-dim);}
.rank-sub{font-family:var(--font-mono);font-size:.6rem;color:var(--text-mute);font-variant-numeric:tabular-nums;}
.track{height:5px;background:var(--panel-2);position:relative;display:block;}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:currentColor;border-radius:0 2px 2px 0;
  transition:width 1.1s var(--spring);}
.rank-val{font-family:var(--font-display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;
  min-width:2.4ch;text-align:right;}
.detail{overflow:hidden;height:0;transition:height .45s var(--spring);}
.detail-in{padding:.4rem .5rem 1.4rem 5.8rem;display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-end;}
.swarm{display:flex;gap:3px;align-items:flex-end;height:64px;}
.swarm .col{display:inline-flex;flex-direction:column-reverse;gap:3px;align-items:center;width:18px;}
.swarm .pip{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.85;}
.swarm .lab{font-family:var(--font-mono);font-size:.55rem;color:var(--text-mute);margin-top:.3rem;}
.detail dl{margin:0;display:grid;grid-template-columns:auto auto;gap:.2rem 1rem;
  font-family:var(--font-mono);font-size:.64rem;color:var(--text-mute);}
.detail dd{margin:0;color:var(--text);font-variant-numeric:tabular-nums;}

/* распределение */
.hist{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;align-items:end;height:190px;}
.hcol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:none;position:relative;}
.hcol .n{font-family:var(--font-mono);font-size:.6rem;color:var(--text-mute);text-align:center;
  padding-bottom:5px;font-variant-numeric:tabular-nums;}
.hcol i{display:block;height:0;border-radius:3px 3px 0 0;background:currentColor;
  transition:height 1s var(--spring),opacity .3s;opacity:.85;}
.hcol:hover i{opacity:1;}
.haxis{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;border-top:1px solid var(--hairline);
  padding-top:.6rem;font-family:var(--font-mono);font-size:.62rem;color:var(--text-mute);text-align:center;
  font-variant-numeric:tabular-nums;}
.hends{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.6rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-mute);margin-top:.7rem;}
.marks{position:relative;height:1.7rem;margin-top:1.1rem;}
.mark{position:absolute;transform:translateX(-50%);font-family:var(--font-mono);font-size:.58rem;
  letter-spacing:.08em;color:var(--violet-hi);white-space:nowrap;background:var(--ink);padding:0 .4rem;}
.mark::before{content:'';position:absolute;left:50%;top:-.55rem;width:1px;height:.4rem;background:var(--violet);}

/* таблица */
.tbl{width:100%;border-collapse:collapse;font-size:.94rem;}
.tbl th{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-mute);font-weight:400;text-align:left;padding:.6rem .7rem;
  border-bottom:1px solid var(--hairline);cursor:none;transition:color .3s;}
.tbl th.sortable:hover{color:var(--violet-hi);}
.tbl th[aria-sort] .car{opacity:1;}
.tbl th .car{opacity:0;font-size:.7em;transition:opacity .3s;}
.tbl td{padding:.8rem .7rem;border-bottom:1px solid var(--hairline);color:var(--text-dim);font-weight:300;
  transition:background .3s,color .3s;}
.tbl tr:hover td{background:var(--panel);color:var(--text);}
.tbl .num{font-family:var(--font-mono);font-size:.82rem;text-align:right;color:var(--text);
  font-variant-numeric:tabular-nums;}
.tbl .who{color:var(--text);}
.strip{display:inline-block;height:4px;background:currentColor;vertical-align:middle;
  transition:width 1s var(--spring);width:0;}

#tip{position:fixed;z-index:9990;pointer-events:none;opacity:0;transform:translateY(6px) scale(.98);
  transition:opacity .18s var(--ease),transform .18s var(--spring);background:var(--panel-2);
  border:1px solid var(--violet);padding:.7rem .9rem;max-width:250px;font-family:var(--font-mono);
  font-size:.66rem;line-height:1.75;color:var(--text-dim);box-shadow:0 18px 40px -20px rgba(0,0,0,.9);}
#tip.show{opacity:1;transform:none;}
#tip b{color:var(--text);font-weight:500;}

.state{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-mute);padding:4rem 0;text-align:center;}
.state .dots::after{content:'';animation:dots 1.4s steps(4,end) infinite;}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.state.err{text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:1rem;
  color:var(--ai);max-width:46ch;margin:0 auto;line-height:1.6;}

footer{border-top:1px solid var(--hairline);padding-top:1.6rem;display:flex;justify-content:space-between;
  gap:1rem;flex-wrap:wrap;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.12em;
  color:var(--text-mute);}
footer a{color:var(--text-mute);text-decoration:none;border-bottom:1px solid var(--hairline);
  transition:color .3s,border-color .3s;}
footer a:hover{color:var(--violet);border-color:var(--violet);}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .9s var(--ease),transform .9s var(--spring);}
.reveal.on{opacity:1;transform:none;}
@media (max-width:760px){
  .rank-btn{grid-template-columns:1.8rem 40px 1fr auto;gap:.7rem;}
  .rank-btn img{width:40px;height:40px;}
  .detail-in{padding-left:.5rem;}
  .hist{height:140px;}
  .hcol .n{display:none;}
  .tbl th:nth-child(4),.tbl td:nth-child(4){display:none;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>

const N = THUMBS.length;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1 = x => (Math.round(x * 10) / 10).toFixed(1);
const mean = a => a.reduce((s,v) => s + v, 0) / a.length;
const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) ** 2))); };
const median = a => { const s = [...a].sort((x,y) => x - y), h = s.length >> 1;
  return s.length % 2 ? s[h] : (s[h-1] + s[h]) / 2; };
const tone = v => v <= 3 ? 'var(--hand)' : v <= 6 ? 'var(--mid)' : 'var(--ai)';
const plural = (n, a, b, c) => {
  const d = n % 10, e = n % 100;
  return (d === 1 && e !== 11) ? a : (d >= 2 && d <= 4 && (e < 10 || e >= 20)) ? b : c;
};
const fmt = iso => {
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}) + ', ' +
    d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
};

/* загрузка через JSONP — обходит CORS у Apps Script */
window.onStats = payload => {
  if(!payload || !payload.ok) return fail(payload && payload.error);
  const all = payload.rows || [];
  const rows = all.filter(r => Array.isArray(r.scores) && r.scores.length === N);
  if(!rows.length) return fail('В таблице пока нет ни одного полного прохождения на ' + N + ' работ.');
  build(rows, all.length - rows.length);
};
function fail(msg){
  $('content').innerHTML = '<div class="state err">Не получилось прочитать таблицу.' +
    (msg ? '<br><br>' + esc(msg) : '') +
    '<br><br>Проверь, что в Apps Script обновлено развертывание с функцией doGet.</div>';
}
const tag = document.createElement('script');
tag.src = ENDPOINT + (ENDPOINT.includes('?') ? '&' : '?') + 'callback=onStats&t=' + Date.now();
tag.onerror = () => fail('Скрипт не ответил на запрос.');
document.head.appendChild(tag);
setTimeout(() => { if(document.querySelector('.state .dots')) fail('Ответа нет уже 20 секунд.'); }, 20000);

/* ---------- сборка страницы ---------- */
let ART = [], JUDGES = [], ALL = [];

function build(rows, skipped){
  ART = Array.from({length:N}, (_, i) => {
    const vals = rows.map(r => Number(r.scores[i]));
    return { i, vals, avg: mean(vals), sd: sd(vals), min: Math.min(...vals), max: Math.max(...vals) };
  });
  JUDGES = rows.map(r => {
    const v = r.scores.map(Number);
    return { name: (r.judge && r.judge !== '(без имени)') ? r.judge : 'Без подписи',
             ts: r.ts, avg: mean(v), sd: sd(v), max: Math.max(...v), min: Math.min(...v) };
  });
  ALL = rows.flatMap(r => r.scores.map(Number));

  const byAvg = [...ART].sort((a,b) => b.avg - a.avg);
  const bySd  = [...ART].sort((a,b) => b.sd - a.sd);
  const overall = mean(ALL);
  const med = median(ALL);
  const counts = Array.from({length:11}, (_, v) => ALL.filter(x => x === v).length);
  const maxCount = Math.max(...counts);
  const consensus = mean(ART.map(a => a.sd));

  const pole = (k, a, s) => `
    <article class="pole reveal" style="color:${tone(a.avg)}">
      <img src="data:image/jpeg;base64,${THUMBS[a.i]}" alt="Работа ${a.i + 1}">
      <div>
        <div class="k">${k}</div>
        <div class="v">${r1(a.avg)}<small> / 10</small></div>
        <div class="s">Работа №${a.i + 1} · ${s}</div>
      </div>
    </article>`;

  $('content').innerHTML = `
    <p class="kicker">Отчёт · обновляется при каждом открытии</p>
    <h1>Что люди видят в этих <em>работах</em></h1>
    <p class="lede">Сводка по всем прохождениям квиза. ${JUDGES.length} ${plural(JUDGES.length,'человек прошёл','человека прошли','человек прошли')} экспертизу, каждый поставил ${N} ${plural(N,'оценку','оценки','оценок')} — всего ${ALL.length} ${plural(ALL.length,'оценка','оценки','оценок')}.</p>

    <div class="summary">
      <div class="tile reveal">
        <span class="k">Средняя по всему</span>
        <span class="v" style="color:${tone(overall)}">${r1(overall)}</span>
        <span class="s">Медиана ${r1(med)}. Ноль — рука, десять — нейросеть.</span>
      </div>
      <div class="tile reveal">
        <span class="k">Разброс мнений</span>
        <span class="v">${r1(consensus)}</span>
        <span class="s">Среднее отклонение внутри одной работы. Чем меньше, тем единодушнее.</span>
      </div>
      <div class="tile reveal">
        <span class="k">Крайние работы</span>
        <span class="v">№${byAvg[0].i + 1}<span style="color:var(--text-mute)"> / </span>№${byAvg[N-1].i + 1}</span>
        <span class="s">Самая «машинная» и самая живая: разрыв ${r1(byAvg[0].avg - byAvg[N-1].avg)} балла.</span>
      </div>
      <div class="tile reveal">
        <span class="k">Форма ответов</span>
        <div class="spark" id="spark">${counts.map((c,v) =>
          `<i data-h="${maxCount ? c / maxCount * 100 : 0}" class="${c === maxCount ? 'hi' : ''}"></i>`).join('')}</div>
        <span class="s">Чаще всего ставили ${counts.indexOf(maxCount)} из 10.</span>
      </div>
    </div>

    <section>
      <span class="eyebrow">Полюса</span>
      <h2>Где сходятся и где спорят</h2>
      <p class="sec-note">Две работы, набравшие крайние оценки, и две, по которым мнения сошлись сильнее или разошлись дальше всего.</p>
      <div class="poles">
        ${pole('Больше всего похожа на ИИ', byAvg[0], 'самая высокая средняя')}
        ${pole('Выглядит живее всех', byAvg[N-1], 'самая низкая средняя')}
        ${pole('Спорная', bySd[0], 'оценки от ' + bySd[0].min + ' до ' + bySd[0].max)}
        ${pole('Единодушная', bySd[N-1], 'оценки от ' + bySd[N-1].min + ' до ' + bySd[N-1].max)}
      </div>
    </section>

    <hr class="rule">

    <section>
      <span class="eyebrow">Рейтинг</span>
      <h2>Все работы по порядку</h2>
      <p class="sec-note">Нажми на строку — развернётся, кто какую оценку поставил именно этой работе.</p>
      <div class="controls" role="group" aria-label="Сортировка">
        <button class="chip" data-sort="avg" aria-pressed="true">По ИИ-шности</button>
        <button class="chip" data-sort="sd" aria-pressed="false">По спорности</button>
        <button class="chip" data-sort="i" aria-pressed="false">По порядку</button>
      </div>
      <div class="rank" id="rank"></div>
    </section>

    <hr class="rule">

    <section>
      <span class="eyebrow">Распределение</span>
      <h2>Какие оценки ставят чаще</h2>
      <p class="sec-note">Все ${ALL.length} выставленных оценок, сложенные по значению. Наведи на столбец — покажу долю.</p>
      <div class="hist" id="hist">
        ${counts.map((c,v) => `
          <div class="hcol" data-v="${v}" data-c="${c}" style="color:${tone(v)}">
            <span class="n">${c || ''}</span>
            <i data-h="${maxCount ? c / maxCount * 100 : 0}"></i>
          </div>`).join('')}
      </div>
      <div class="haxis">${counts.map((_,v) => `<span>${v}</span>`).join('')}</div>
      <div class="marks">
        <span class="mark" style="left:${(overall / 10) * 100}%">среднее ${r1(overall)}</span>
      </div>
      <div class="hends"><span>Точно рука</span><span>Точно нейросеть</span></div>
    </section>

    <hr class="rule">

    <section>
      <span class="eyebrow">Эксперты</span>
      <h2>Кто строже смотрит</h2>
      <p class="sec-note">Средняя оценка, которую человек поставил всей подборке. Выше — чаще видел машину. Колонки сортируются.</p>
      <table class="tbl" id="judges">
        <thead><tr>
          <th class="sortable" data-k="name">Кто <span class="car">▾</span></th>
          <th class="sortable num" data-k="avg" style="text-align:right" aria-sort="descending">Средняя <span class="car">▾</span></th>
          <th class="sortable num" data-k="sd" style="text-align:right">Разброс <span class="car">▾</span></th>
          <th class="sortable num" data-k="ts" style="text-align:right">Когда <span class="car">▾</span></th>
        </tr></thead>
        <tbody></tbody>
      </table>
      ${skipped ? `<p class="sec-note" style="margin-top:1.4rem">Пропущено неполных или тестовых записей: ${skipped}.</p>` : ''}
    </section>`;

  $('updated').textContent = 'Обновлено ' + fmt(new Date().toISOString());
  $('mastMeta').textContent = JUDGES.length + ' ' + plural(JUDGES.length,'прохождение','прохождения','прохождений') + ' · ' + N + ' работ';

  renderRank('avg');
  renderJudges('avg', -1);
  wireControls();
  animateIn();
  wireTooltips();
}

/* рейтинг работ + раскрытие */
function renderRank(key){
  const list = [...ART].sort((a,b) => key === 'i' ? a.i - b.i : b[key] - a[key]);
  $('rank').innerHTML = list.map((a,k) => `
    <div class="rank-item" style="color:${tone(a.avg)}">
      <button class="rank-btn" data-art="${a.i}" aria-expanded="false">
        <span class="rank-pos">${String(k + 1).padStart(2,'0')}</span>
        <img src="data:image/jpeg;base64,${THUMBS[a.i]}" alt="Работа ${a.i + 1}">
        <span class="rank-mid">
          <span class="rank-top">
            <span class="rank-name">Работа №${a.i + 1}</span>
            <span class="rank-sub">от ${a.min} до ${a.max} · разброс ${r1(a.sd)}</span>
          </span>
          <span class="track"><i data-w="${a.avg / 10 * 100}"></i></span>
        </span>
        <span class="rank-val">${r1(a.avg)}</span>
      </button>
      <div class="detail" id="d${a.i}"></div>
    </div>`).join('');

  requestAnimationFrame(() => requestAnimationFrame(() => {
    $('rank').querySelectorAll('.track i').forEach((el,idx) => {
      el.style.transitionDelay = (idx * 35) + 'ms';
      el.style.width = el.dataset.w + '%';
    });
  }));

  $('rank').querySelectorAll('.rank-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleDetail(btn));
  });
}

function toggleDetail(btn){
  const i = +btn.dataset.art, box = $('d' + i), open = btn.getAttribute('aria-expanded') === 'true';
  document.querySelectorAll('.rank-btn[aria-expanded="true"]').forEach(b => {
    if(b !== btn){ b.setAttribute('aria-expanded','false'); $('d' + b.dataset.art).style.height = '0px'; }
  });
  if(open){ btn.setAttribute('aria-expanded','false'); box.style.height = '0px'; return; }
  const a = ART[i];
  const cols = Array.from({length:11}, (_, v) => {
    const who = JUDGES.filter((j, idx) => a.vals[idx] === v);
    return `<span class="col">${who.map(() => '<span class="pip"></span>').join('')}<span class="lab">${v}</span></span>`;
  }).join('');
  box.innerHTML = `<div class="detail-in">
      <div><div class="swarm">${cols}</div></div>
      <dl>
        <dt>средняя</dt><dd>${r1(a.avg)}</dd>
        <dt>медиана</dt><dd>${r1(median(a.vals))}</dd>
        <dt>разброс</dt><dd>${r1(a.sd)}</dd>
        <dt>крайние</dt><dd>${a.min} — ${a.max}</dd>
      </dl>
    </div>`;
  btn.setAttribute('aria-expanded','true');
  box.style.height = box.firstElementChild.offsetHeight + 'px';
}

/* таблица экспертов */
function renderJudges(key, dir){
  const rows = [...JUDGES].sort((a,b) => {
    const x = key === 'name' ? a.name.localeCompare(b.name,'ru') :
              key === 'ts' ? new Date(a.ts) - new Date(b.ts) : a[key] - b[key];
    return x * dir;
  });
  const maxAvg = Math.max(...JUDGES.map(j => j.avg)) || 1;
  $('judges').querySelector('tbody').innerHTML = rows.map(j => `
    <tr style="color:${tone(j.avg)}">
      <td class="who">${esc(j.name)}</td>
      <td class="num">${r1(j.avg)} <i class="strip" data-w="${j.avg / maxAvg * 46}"></i></td>
      <td class="num">${r1(j.sd)}</td>
      <td class="num">${fmt(j.ts)}</td>
    </tr>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.strip').forEach((el,i) => {
      el.style.transitionDelay = (i * 40) + 'ms';
      el.style.width = el.dataset.w + 'px';
    });
  }));
  $('judges').querySelectorAll('th').forEach(th => {
    if(th.dataset.k === key) th.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
  });
}

function wireControls(){
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed','false'));
      chip.setAttribute('aria-pressed','true');
      renderRank(chip.dataset.sort);
    });
  });
  let key = 'avg', dir = -1;
  $('judges').querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.k;
      dir = (k === key) ? -dir : (k === 'name' ? 1 : -1);
      key = k;
      renderJudges(key, dir);
    });
  });
}

/* появление секций и графиков */
function animateIn(){
  const io = new IntersectionObserver(es => es.forEach(e => {
    if(!e.isIntersecting) return;
    e.target.classList.add('on');
    io.unobserve(e.target);
  }), { threshold:.15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  const bars = new IntersectionObserver(es => es.forEach(e => {
    if(!e.isIntersecting) return;
    e.target.querySelectorAll('[data-h]').forEach((el,i) => {
      el.style.transitionDelay = (i * 45) + 'ms';
      el.style.height = el.dataset.h + '%';
    });
    bars.unobserve(e.target);
  }), { threshold:.3 });
  ['hist','spark'].forEach(id => { const el = $(id); if(el) bars.observe(el); });
}

/* подсказки */
function wireTooltips(){
  const tip = $('tip');
  const show = html => { tip.innerHTML = html; tip.classList.add('show'); };
  const hide = () => tip.classList.remove('show');
  addEventListener('mousemove', e => {
    if(!tip.classList.contains('show')) return;
    const pad = 16, w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(e.clientX + pad, innerWidth - w - 8) + 'px';
    tip.style.top = Math.max(8, Math.min(e.clientY + pad, innerHeight - h - 8)) + 'px';
  });
  addEventListener('mouseover', e => {
    const col = e.target.closest('.hcol');
    if(col){
      const c = +col.dataset.c, pct = ALL.length ? Math.round(c / ALL.length * 100) : 0;
      return show(`Оценка <b>${col.dataset.v}</b> из 10<br>поставлена <b>${c}</b> ${plural(c,'раз','раза','раз')} · ${pct}%`);
    }
    const btn = e.target.closest('.rank-btn');
    if(btn){
      const a = ART[+btn.dataset.art];
      return show(`<b>Работа №${a.i + 1}</b><br>средняя <b>${r1(a.avg)}</b> · медиана <b>${r1(median(a.vals))}</b><br>разброс <b>${r1(a.sd)}</b><br><br>нажми, чтобы раскрыть`);
    }
    hide();
  });
  addEventListener('mouseout', e => {
    if(!e.relatedTarget || !e.relatedTarget.closest('.hcol, .rank-btn')) hide();
  });
}

/* курсор */
(function(){
  const cursor = $('cursor'), ring = $('cursorRing');
  if(!cursor || !ring) return;
  let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my;
  addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
  });
  (function loop(){
    rx += (mx - rx) * .13; ry += (my - ry) * .13;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(loop);
  })();
  const SEL = 'a, button, .hcol, .pole, .tile, tr';
  const set = (d,r,c) => {
    cursor.style.width = cursor.style.height = d + 'px';
    ring.style.width = ring.style.height = r + 'px';
    ring.style.borderColor = c;
  };
  addEventListener('mouseover', e => { if(e.target.closest(SEL)) set(15, 54, 'rgba(169,156,255,.85)'); });
  addEventListener('mouseout',  e => { if(e.target.closest(SEL)) set(7, 32, 'rgba(143,128,240,.4)'); });
})();
</script>
